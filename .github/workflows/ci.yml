name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_MODE: mock          # never call a real backend in CI
  PYTHONPATH: .            # make the repo-root `ticketiq` package importable to bare `python scripts/...`

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry && poetry config virtualenvs.create false && poetry lock && poetry install
      - name: ruff
        run: ruff check ticketiq tests scripts
      - name: black
        run: black --check ticketiq tests scripts
      - name: mypy
        run: mypy ticketiq
        continue-on-error: true   # advisory: strict typing is a goal, not a gate

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install poetry && poetry config virtualenvs.create false && poetry lock && poetry install
      - name: pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  rl-evidence:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry && poetry config virtualenvs.create false && poetry lock && poetry install
      # Fails if the bandit stops beating a uniform-random router.
      - name: Bandit learning check
        run: python scripts/bandit_simulation.py --rounds 8000 --json /tmp/rl.json
      - name: Assert the bandit outperforms random
        run: |
          python - <<'PY'
          import json
          r = json.load(open("/tmp/rl.json"))
          q1, q4 = r["quarters"][0]["mean_reward"], r["quarters"][3]["mean_reward"]
          assert q4 > r["random_policy_expected_reward"], (q4, r["random_policy_expected_reward"])
          assert r["state_variant_accuracy"] > 0.6, r["state_variant_accuracy"]
          print(f"OK  Q1={q1:.3f} -> Q4={q4:.3f}  random={r['random_policy_expected_reward']:.3f}")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ticketiq:ci
      - name: Smoke test the container
        run: |
          docker run -d --name ticketiq -p 8000:8000 ticketiq:ci
          # Always surface the container's own logs — a container that never
          # serves /healthz is otherwise a silent 60s timeout with no cause.
          trap 'echo "=== container logs ==="; docker logs ticketiq 2>&1 || true; docker rm -f ticketiq >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && break
            if [ -z "$(docker ps -q -f name=ticketiq)" ]; then
              echo "::error::container exited before becoming healthy"; exit 1
            fi
            sleep 2
          done

          curl -sf -X POST http://localhost:8000/ticket \
            -H 'Content-Type: application/json' \
            -d '{"subject":"Double charged","body":"Billed twice, please refund.","tier":"pro"}' \
            | tee /dev/stderr | grep -q transaction_id

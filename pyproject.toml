[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ticketiq"
version = "0.1.0"
description = "Self-optimizing support ticket triage agent"
authors = ["Candidate <candidate@example.com>"]
readme = "README.md"
packages = [{ include = "ticketiq" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
httpx = "^0.27.0"

[tool.poetry.group.optional.dependencies]
# Not required: the default sentiment backend is a built-in lexicon and the
# default retrieval backend is the project's own TF-IDF index.
vadersentiment = { version = "^3.3.2", optional = true }
sentence-transformers = { version = "^3.0.0", optional = true }
matplotlib = { version = "^3.9.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.0"
black = "^24.10.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"

[tool.poetry.scripts]
ticketiq-train = "scripts.train_classifier:main"
ticketiq-simulate = "scripts.bandit_simulation:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ticketiq", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501", "B008", "ARG001", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
packages = ["ticketiq"]
mypy_path = "."
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["ticketiq"]
branch = true
omit = ["*/remote.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
